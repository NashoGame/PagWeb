<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TiendaVHS - Inicio</title>
    <!-- Enlazamos nuestra hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- header: Define el encabezado principal de la página -->
    <header>
        <h1>TiendaVHS Retro</h1>
        <!-- nav: Contiene los hipervínculos de navegación del sitio -->
        <nav>
            <a href="index.html">Tienda</a> |
            <a href="login.html">Iniciar Sesión</a> |
            <a href="registro.html">Registro</a> |
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <!-- main: Envuelve todo el contenido principal y único de esta página -->
    <main>
        <!-- section: Agrupa un bloque temático, en este caso, el catálogo -->
        <section>
            <h2>Catálogo de Películas</h2>
            
            <!-- article: Representa un elemento independiente, ideal para presentar cada producto en vez de usar tablas -->
            <article>
                <h3>Volver al Futuro (VHS)</h3>
                <p>Precio: $5.000</p>
                <button>Añadir al carrito</button>
            </article>

            <article>
                <h3>Matrix (VHS)</h3>
                <p>Precio: $4.500</p>
                <button>Añadir al carrito</button>
            </article>
        </section>
    </main>

    <!-- footer: Define el pie de página con información de cierre -->
    <footer>
        <p>&copy; 2026 TiendaVHS.</p>
    </footer>
</body>
</html>
