<!-- Declara que este documento es HTML5 moderno -->
<!DOCTYPE html>
<!-- Indica que el idioma principal de la página es español -->
<html lang="es">
<head>
    <!-- Permite que el navegador lea caracteres especiales como la 'ñ' o tildes -->
    <meta charset="UTF-8">
    <!-- El texto que aparecerá en la pestaña del navegador -->
    <title>TiendaVHS - Inicio</title>
    <!-- Conecta este archivo HTML con tu hoja de estilos CSS externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <header>: Etiqueta semántica para el encabezado de la página. 
         class="ps-header": Le da un nombre para poder darle diseño desde el CSS -->
    <header class="ps-header">
        <!-- <div>: Es una caja genérica para agrupar elementos. Aquí guarda el logo -->
        <div class="logo">📼 TiendaVHS</div>
        
        <!-- <nav>: Etiqueta semántica que agrupa los enlaces de navegación -->
        <nav class="ps-nav">
            <!-- <a>: Enlaces a tus otras páginas -->
            <a href="index.html">Tienda ˅</a>
            <a href="registro.html">Registro ˅</a>
            <a href="carrito.html">Carrito ˅</a>
        </nav>
        
        <!-- Otra caja genérica para agrupar los botones de la derecha -->
        <div class="ps-actions">
            <!-- <span>: Etiqueta para agrupar texto en línea, aquí usamos un emoji de lupa -->
            <span class="search">🔍</span>
            <a href="login.html" class="btn-login">Iniciar sesión</a>
        </div>
    </header>

    <!-- <main>: Etiqueta semántica que envuelve el contenido principal y único del sitio -->
    <main class="ps-hero">
        <!-- <section>: Agrupa una sección temática (la mitad izquierda de la pantalla)
             id="hero-info": Un identificador ÚNICO que usaremos en JavaScript para modificar esta caja -->
        <section class="hero-info" id="hero-info">
            <!-- <h2> y <p> vacíos: Tienen IDs únicos porque JavaScript escribirá texto dentro de ellos -->
            <h2 id="pelicula-titulo">Cargando...</h2>
            <p id="pelicula-sinopsis"></p>
            <p class="precio" id="pelicula-precio"></p>
            <!-- <button>: Un botón interactivo -->
            <button class="btn-reservar">Reservar ahora</button>
        </section>
        
        <!-- <aside>: Etiqueta semántica para contenido lateral o secundario (la lista de la derecha) -->
        <aside class="hero-catalogo">
            <!-- Esta caja está vacía porque JavaScript inyectará las películas aquí automáticamente -->
            <div class="lista-peliculas" id="lista-peliculas"></div>
        </aside>
    </main>

    <!-- <script>: Conecta y ejecuta tu archivo JavaScript. Se pone al final del <body> 
         para asegurar que el HTML cargue primero antes de que el código intente modificarlo -->
    <script src="validaciones.js"></script>
</body>
</html>
